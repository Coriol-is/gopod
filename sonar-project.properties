# SonarCloud automatic analysis reads this file from the repository root.
# Scope: production Go code only. Tests, fixtures, the vendored frf-tui skill
# and container build assets are excluded so the private-project line budget
# (50k ncloc on the current plan) is not exhausted; main analysis has been
# failing since 77fd0bb (2026-10-27), see docs/reviews/2026-11-02-sonar-triage.md.
sonar.sources=.
sonar.tests=.
sonar.test.inclusions=**/*_test.go
sonar.exclusions=**/*_test.go,**/testdata/**,skills/frf-tui/**,container/**,docs/**,.github/**
sonar.test.exclusions=**/testdata/**,skills/frf-tui/**
sonar.cpd.exclusions=**/*_test.go
