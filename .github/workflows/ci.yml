name: ci

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: go build ./...
      - run: go vet ./...
      - run: go test ./...

  isolation-spike:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Install pinned native CLIs (no account login)
        run: |
          npm install --prefix "$RUNNER_TEMP/isolation-cli" @anthropic-ai/claude-code@2.1.310 @openai/codex@0.164.0
          echo "$RUNNER_TEMP/isolation-cli/node_modules/.bin" >> "$GITHUB_PATH"
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Qualify production group native policy (no accounts or inference)
        env:
          GOPOD_GROUP_NATIVE_TEST: '1'
        run: go test ./internal/runner -run '^TestGroupNativeInventory' -count=1
      - name: Preload synthetic tool image
        run: |
          docker pull node@sha256:de170b39439eb0e5a3444ad7d60b015614a381e10fecae2e30ec9e735122f38d
          docker tag node@sha256:de170b39439eb0e5a3444ad7d60b015614a381e10fecae2e30ec9e735122f38d node:22-slim
      - name: Build pinned group Codex fixture image
        run: docker build -f container/group/Dockerfile.codex -t gopod-agent-group-codex:offline .
      - name: Build credential-free group tools
        run: docker build -f container/group/Dockerfile.tools -t gopod-group-tools:ci .
      - name: Verify real Docker snapshots and hard tool limits
        env:
          GOPOD_GROUP_DOCKER_TEST: '1'
          GOPOD_GROUP_TOOL_IMAGE: gopod-group-tools:ci
        run: go test -v -count=1 ./internal/groupsandbox -run '^TestDockerCredentialFreeSnapshots$'
      - name: Qualify native ChatGPT-auth SSE without internet or real credentials
        run: python3 experiments/subscription-isolation/codex_sse_auth_probe.py --cli-image gopod-agent-group-codex:offline
      - name: Qualify isolated tools against local mock providers
        env:
          PYTHONDONTWRITEBYTECODE: '1'
          GOPOD_ISOLATION_DOCKER_TEST: '1'
          GOPOD_CODEX_OFFLINE_TEST: '1'
          GOPOD_CLAUDE_OFFLINE_TEST: '1'
        run: python3 -m unittest discover -s experiments/subscription-isolation -p '*test*.py' -v
