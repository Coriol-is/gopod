name: ci

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go build ./...
      - run: go vet ./...
      - run: go test ./...

  isolation-spike:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned native CLIs (no account login)
        run: |
          npm install --prefix "$RUNNER_TEMP/isolation-cli" @anthropic-ai/claude-code@2.1.310 @openai/codex@0.164.0
          echo "$RUNNER_TEMP/isolation-cli/node_modules/.bin" >> "$GITHUB_PATH"
      - name: Preload synthetic tool image
        run: |
          docker pull node@sha256:de170b39439eb0e5a3444ad7d60b015614a381e10fecae2e30ec9e735122f38d
          docker tag node@sha256:de170b39439eb0e5a3444ad7d60b015614a381e10fecae2e30ec9e735122f38d node:22-slim
      - name: Qualify isolated tools against local mock providers
        env:
          PYTHONDONTWRITEBYTECODE: '1'
          GOPOD_ISOLATION_DOCKER_TEST: '1'
          GOPOD_CODEX_OFFLINE_TEST: '1'
          GOPOD_CLAUDE_OFFLINE_TEST: '1'
        run: python3 -m unittest discover -s experiments/subscription-isolation -p '*test*.py' -v
