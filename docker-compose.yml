# gopod production deployment.
#
# Usage:
#   docker compose build
#   docker compose up -d
#
# The gopod service runs the Go binary inside a container.
# It manages agent containers as SIBLINGS on the same Docker daemon
# via the mounted docker.sock (not docker-in-docker — the daemon is
# shared with the host).
#
# IMPORTANT: GOPOD_HOST_DATA_DIR must be set to the ABSOLUTE HOST
# path where gopod data lives. Agent containers are created by
# the Docker daemon which resolves bind-mount paths on the HOST, not
# inside this compose container. The data dir is mounted at the SAME
# path inside this container so gopod's internal path references
# match what the Docker daemon sees.
#
# Example .env:
#   TELEGRAM_BOT_TOKEN=...
#   GOPOD_OWNER_CHAT_ID=123456789
#   OPENAI_API_KEY=...
#   GOPOD_HOST_DATA_DIR=/opt/gopod/data
#   GOPOD_HOST_REPO_DIR=/opt/gopod/repo

services:
  gopod:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VERSION: ${GOPOD_VERSION:-dev}
    restart: unless-stopped
    env_file: .env
    environment:
      # Data dir MUST match the host path so agent container bind
      # mounts resolve correctly on the Docker daemon.
      GOPOD_DATA_DIR: ${GOPOD_HOST_DATA_DIR:-/opt/gopod/data}
      GOPOD_REPO_ROOT: ${GOPOD_HOST_REPO_DIR:-/opt/gopod/repo}
    volumes:
      # Docker socket for managing agent containers.
      - /var/run/docker.sock:/var/run/docker.sock
      # Data directory at the SAME path as on the host.
      - ${GOPOD_HOST_DATA_DIR:-/opt/gopod/data}:${GOPOD_HOST_DATA_DIR:-/opt/gopod/data}
      # Repo directory (for owner chat's /workspace/project mount).
      - ${GOPOD_HOST_REPO_DIR:-/opt/gopod/repo}:${GOPOD_HOST_REPO_DIR:-/opt/gopod/repo}
      # Chats directory (for agent workspaces).
      - ${GOPOD_HOST_REPO_DIR:-/opt/gopod/repo}/chats:${GOPOD_HOST_REPO_DIR:-/opt/gopod/repo}/chats
      # Container skills.
      - ${GOPOD_HOST_REPO_DIR:-/opt/gopod/repo}/container/skills:${GOPOD_HOST_REPO_DIR:-/opt/gopod/repo}/container/skills:ro
    # gopod needs to create files as the host user so bind-mount
    # permissions work. Override with your host uid:gid.
    user: "${GOPOD_UID:-1000}:${GOPOD_GID:-1000}"
    # Add the host docker.sock group so the in-container process can
    # talk to the host Docker daemon.
    group_add:
      - "${DOCKER_GID:-985}"
    # Memory API. Spawned agent containers reach gopod via
    # `host.docker.internal:9876`, which on Linux maps to the host's
    # docker-bridge IP (e.g. 172.17.0.1). Publishing 9876 makes the
    # server's port reachable from that bridge. Binding to 0.0.0.0 is
    # required so the docker0 IP is among the listening interfaces;
    # 127.0.0.1 alone is unreachable from sibling containers. Operators
    # who don't trust their LAN should add a host firewall rule
    # (e.g. ufw deny in 9876) — Docker's `iptables -I DOCKER` chain
    # bypasses ufw, so the firewall must target the bridge interface.
    ports:
      - "9876:9876"
